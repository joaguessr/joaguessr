<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JoaGuessr - Player</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    /* Header Bar */
    #header {
      height: 60px;
      background-color: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #333;
      z-index: 1000;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name-container {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .player-name {
      font-weight: bold;
      font-size: 16px;
      color: #ffffff;
      text-decoration: underline dotted #888;
    }
    .edit-icon {
      font-size: 12px;
      color: #aaa;
    }
    .game-status {
      font-size: 12px;
      color: #aaa;
    }
    /* Action Area */
    #action-area {
      display: flex;
      align-items: center;
    }
    #submitBtn {
      background-color: #00d26a;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #submitBtn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    #submittedMsg {
      display: none;
      color: #00d26a;
      font-weight: bold;
      font-size: 14px;
      text-align: right;
    }
    /* Map Container */
    #map {
      flex: 1;
      width: 100%;
      background: #222;
    }
    
    /* Welcome Popup Modal */
    #welcomeModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-card h2 {
      margin-bottom: 12px;
      color: #00d26a;
      font-size: 20px;
    }
    .modal-card p {
      font-size: 15px;
      color: #ddd;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .modal-card button {
      background: #00d26a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Welcome Modal -->
<div id="welcomeModal" style="display:none;">
  <div class="modal-card">
    <h2 id="welcomeTitle">Welcome!</h2>
    <p id="welcomeMessageText">Loading welcome message...</p>
    <button onclick="closeWelcomeModal()">Let's Play!</button>
  </div>
</div>

<div id="app-container">
  <div id="header">
    <div class="player-info">
      <div class="player-name-container" onclick="changePlayerName()">
        <span class="player-name" id="displayName">Player</span>
        <span class="edit-icon">✏️</span>
      </div>
      <div class="game-status" id="displayStatus">Q: 1/20 | Score: 0</div>
    </div>
    <div id="action-area">
      <button id="submitBtn" disabled>Submit Guess</button>
      <span id="submittedMsg">Your guess has been submitted</span>
    </div>
  </div>
  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDK (v8 to match summary and admin tools) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. FIREBASE CONFIGURATION (Matches admin-users and summary database URL)
  const firebaseConfig = {
    apiKey: "AIzaSyAK-Ho6KXOyBIJuNASCjXYtbb7ZbM_eD-A",
    authDomain: "joaguessr.firebaseapp.com",
    databaseURL: "https://joaguessr-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "joaguessr",
    storageBucket: "joaguessr.firebasestorage.app",
    messagingSenderId: "852224945761",
    appId: "1:852224945761:web:5adc0b5a6e1282b7030420"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // 2. GET PLAYER ID FROM URL (?id=p_12345)
  const urlParams = new URLSearchParams(window.location.search);
  const playerId = urlParams.get('id') || 'guest_' + Math.floor(Math.random() * 1000);

  // UI References
  const submitBtn = document.getElementById('submitBtn');
  const submittedMsg = document.getElementById('submittedMsg');
  const displayName = document.getElementById('displayName');
  const displayStatus = document.getElementById('displayStatus');
  const welcomeModal = document.getElementById('welcomeModal');
  const welcomeTitle = document.getElementById('welcomeTitle');
  const welcomeMessageText = document.getElementById('welcomeMessageText');

  let currentPin = null;
  let selectedCoords = null;
  let currentQuestion = 1;
  let hasSubmittedCurrentQ = false;
  let currentPlayerName = "Player";

  // 3. MAP SETUP (OpenStreetMap Standard Tile Layer)
  const map = L.map('map', {
    zoomControl: true
  }).setView([1.3521, 103.8198], 12);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Place/Move Pin Event
  map.on('click', function(e) {
    if (hasSubmittedCurrentQ) return;

    selectedCoords = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    if (currentPin) {
      currentPin.setLatLng(e.latlng);
    } else {
      currentPin = L.marker(e.latlng).addTo(map);
    }

    submitBtn.disabled = false;
  });

  // 4. FETCH PLAYER DATA & WELCOME MSG
  db.ref(`players/${playerId}`).on('value', (snap) => {
    const data = snap.val();
    if (data) {
      currentPlayerName = data.name || "Player";
      displayName.textContent = currentPlayerName;
      
      // Display score
      displayStatus.textContent = `Q: ${currentQuestion}/20 | Score: ${data.score || 0}`;

      // Show welcome popup once if welcome message exists and hasn't been closed
      if (data.welcomeMsg && !sessionStorage.getItem('welcomeShown')) {
        welcomeTitle.textContent = `Welcome, ${currentPlayerName}!`;
        welcomeMessageText.textContent = data.welcomeMsg;
        welcomeModal.style.display = 'flex';
      }
    }
  });

  function closeWelcomeModal() {
    welcomeModal.style.display = 'none';
    sessionStorage.setItem('welcomeShown', 'true');
  }

  // 5. ALLOW PLAYER TO EDIT PRESET NAME
  function changePlayerName() {
    const newName = prompt("Change display name:", currentPlayerName);
    if (newName && newName.trim() !== "") {
      const sanitizedName = newName.trim();
      db.ref(`players/${playerId}/name`).set(sanitizedName);
    }
  }

  // 6. SUBMIT GUESS LOGIC
  submitBtn.addEventListener('click', function() {
    if (!selectedCoords || hasSubmittedCurrentQ) return;

    db.ref(`guesses/q${currentQuestion}/${playerId}`).set({
      lat: selectedCoords.lat,
      lng: selectedCoords.lng,
      timestamp: Date.now()
    }).then(() => {
      hasSubmittedCurrentQ = true;

      // Hide button and display message
      submitBtn.style.display = 'none';
      submittedMsg.style.display = 'inline';
    }).catch((err) => {
      alert("Error submitting guess. Please try again.");
      console.error(err);
    });
  });

  // 7. LISTEN FOR GAME STATE CHANGES
  db.ref('gameState').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const newQ = data.currentQuestion || 1;

    // Reset pin and submit button when host moves to new question
    if (newQ !== currentQuestion) {
      currentQuestion = newQ;
      hasSubmittedCurrentQ = false;
      selectedCoords = null;

      if (currentPin) {
        map.removeLayer(currentPin);
        currentPin = null;
      }

      submitBtn.style.display = 'inline-block';
      submitBtn.disabled = true;
      submittedMsg.style.display = 'none';

      displayStatus.textContent = `Q: ${currentQuestion}/20 | Score: ${displayStatus.textContent.split('| Score: ')[1] || 0}`;
    }
  });
</script>

</body>
</html>
