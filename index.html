<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JoaGuessr - Player</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    /* Header Bar */
    #header {
      height: 60px;
      background-color: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #333;
      z-index: 1000;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-weight: bold;
      font-size: 16px;
    }
    .game-status {
      font-size: 12px;
      color: #aaa;
    }
    /* Action Area */
    #action-area {
      display: flex;
      align-items: center;
    }
    #submitBtn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #submitBtn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    #submittedMsg {
      display: none;
      color: #4CAF50;
      font-weight: bold;
      font-size: 14px;
      text-align: right;
    }
    /* Map Container */
    #map {
      flex: 1;
      width: 100%;
      background: #222;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <div class="player-info">
      <div class="player-name" id="displayName">Player</div>
      <div class="game-status" id="displayStatus">Q: 1/20 | Score: 0</div>
    </div>
    <div id="action-area">
      <button id="submitBtn" disabled>Submit Guess</button>
      <span id="submittedMsg">Your guess has been submitted</span>
    </div>
  </div>
  <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDKs (Compat version for lightweight implementation) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  // 1. FIREBASE CONFIGURATION (Replace with your Firebase details if different)
  const firebaseConfig = {
    databaseURL: "https://joaguessr-default-rtdb.firebaseio.com" // Update if using a custom DB URL
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // 2. PARSE USER ID FROM URL (?id=p_123456)
  const urlParams = new URLSearchParams(window.location.search);
  const playerId = urlParams.get('id') || 'guest_' + Math.floor(Math.random() * 1000);

  // UI Elements
  const submitBtn = document.getElementById('submitBtn');
  const submittedMsg = document.getElementById('submittedMsg');
  const displayName = document.getElementById('displayName');
  const displayStatus = document.getElementById('displayStatus');

  let currentPin = null;
  let selectedCoords = null;
  let currentQuestion = 1;
  let hasSubmittedCurrentQ = false;

  // 3. INITIALIZE LEAFLET MAP (Fixes "API KEY REQUIRED" background issue)
  const map = L.map('map', {
    zoomControl: true
  }).setView([1.3521, 103.8198], 12); // Default centered on Singapore

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Map Click Event to Place/Move Pin
  map.on('click', function(e) {
    if (hasSubmittedCurrentQ) return; // Lock pin placement if already submitted

    selectedCoords = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    if (currentPin) {
      currentPin.setLatLng(e.latlng);
    } else {
      currentPin = L.marker(e.latlng).addTo(map);
    }

    submitBtn.disabled = false;
  });

  // 4. SUBMIT GUESS LOGIC
  submitBtn.addEventListener('click', function() {
    if (!selectedCoords || hasSubmittedCurrentQ) return;

    // Save guess to Firebase under player's record
    db.ref(`guesses/q${currentQuestion}/${playerId}`).set({
      lat: selectedCoords.lat,
      lng: selectedCoords.lng,
      timestamp: Date.now()
    }).then(() => {
      hasSubmittedCurrentQ = true;

      // Update UI: Hide button, show success message
      submitBtn.style.display = 'none';
      submittedMsg.style.display = 'inline';
    }).catch((err) => {
      alert("Error submitting guess. Please try again.");
      console.error(err);
    });
  });

  // 5. LISTEN FOR GAME STATE CHANGES (Syncs question number and score)
  db.ref('gameState').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const newQ = data.currentQuestion || 1;

    // Reset interface if host advances to a new question
    if (newQ !== currentQuestion) {
      currentQuestion = newQ;
      hasSubmittedCurrentQ = false;
      selectedCoords = null;

      if (currentPin) {
        map.removeLayer(currentPin);
        currentPin = null;
      }

      // Restore submit button for the new round
      submitBtn.style.display = 'inline-block';
      submitBtn.disabled = true;
      submittedMsg.style.display = 'none';
    }

    // Update status bar header
    db.ref(`players/${playerId}`).once('value', (playerSnap) => {
      const playerData = playerSnap.val() || {};
      const name = playerData.name || playerId;
      const score = playerData.score || 0;

      displayName.textContent = name;
      displayStatus.textContent = `Q: ${currentQuestion}/20 | Score: ${score}`;
    });
  });
</script>

</body>
</html>
