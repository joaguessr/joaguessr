<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projector Summary & Question Admin</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    body, html { margin:0; padding:0; height:100%; width:100%; font-family:sans-serif; background:#111; color:white; overflow:hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    /* Main Control Bar */
    #admin-bar {
      position: absolute; top: 15px; left: 15px; z-index: 1000;
      background: rgba(20, 20, 20, 0.95); color: white;
      padding: 12px 18px; border-radius: 10px; display: flex;
      align-items: center; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }

    #event-q-title {
      font-size: 18px;
      font-weight: bold;
      color: #00d26a;
      display: none;
      margin-right: 5px;
    }

    /* Target Editor Drawer */
    #target-editor {
      position: absolute; top: 75px; left: 15px; z-index: 1000;
      background: rgba(20, 20, 20, 0.95); color: white;
      padding: 15px; border-radius: 10px; width: 300px; display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #444;
    }

    select, button, input {
      padding: 8px 12px; font-size: 14px; border-radius: 6px; border: none; font-weight: bold;
    }
    select, input { background: #333; color: white; border: 1px solid #555; }
    button { background: #00d26a; color: white; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #00b058; }
    button.secondary { background: #444; }
    button.secondary:hover { background: #555; }
    button.danger { background: #e74c3c; color: white; }
    button.danger:hover { background: #c0392b; }
    button.mode-btn { background: #3498db; }
    button.mode-btn:hover { background: #2980b9; }

    .leaflet-popup-content-wrapper { font-size: 16px; text-align: center; padding: 5px; }
  </style>
</head>
<body>

  <!-- Main Display Controller Bar -->
  <div id="admin-bar">
    <div id="q-select-container">
      <label>Question:</label>
      <select id="q-select" onchange="onQuestionChange()">
        <script>
          for(let i=1; i<=20; i++) {
            document.write(`<option value="${i}">Q${i}</option>`);
          }
        </script>
      </select>
    </div>

    <!-- Event Mode Display Title -->
    <span id="event-q-title">Question 1</span>

    <!-- Step 1: Reveal Guesses -->
    <button onclick="revealPlayerGuesses()">Reveal Map Pins</button>

    <!-- Step 2: Reveal Correct Answer -->
    <button class="danger" onclick="revealAnswerPin()">📍 Reveal Answer</button>
    
    <!-- Admin Buttons -->
    <button id="btn-set-answers" class="secondary admin-only" onclick="toggleEditor()">⚙️ Set Answers</button>
    <button id="btn-reset-guesses" class="danger admin-only" onclick="resetAllGuesses()">🗑️ Reset All Guesses</button>

    <!-- Event Mode Next Question Button -->
    <button id="btn-next-q" class="secondary" onclick="nextQuestion()" style="display:none;">Next Question ➡️</button>

    <!-- Toggle Mode Button -->
    <button id="btn-toggle-mode" class="mode-btn" onclick="toggleEventMode()">🎉 Event Mode</button>
  </div>

  <!-- Easy Question Manager Drawer -->
  <div id="target-editor">
    <h3 style="margin:0 0 10px 0; font-size:16px; color:#00d26a;">Edit Answer Location</h3>
    <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Right-click any place on Google Maps to copy coordinates.</p>
    
    <label style="font-size:12px;">Latitude:</label>
    <input type="number" step="any" id="edit-lat" placeholder="e.g. 48.8584" style="width:100%; margin-bottom:8px; box-sizing:border-box;">
    
    <label style="font-size:12px;">Longitude:</label>
    <input type="number" step="any" id="edit-lng" placeholder="e.g. 2.2945" style="width:100%; margin-bottom:12px; box-sizing:border-box;">
    
    <button onclick="saveTargetToFirebase()" style="width:100%;">Save Location for Selected Q</button>
  </div>

  <div id="map"></div>

  <script>
    // 1. FIREBASE INITIALIZATION
    const firebaseConfig = {
      apiKey: "AIzaSyAK-Ho6KXOyBIJuNASCjXYtbb7ZbM_eD-A",
      authDomain: "joaguessr.firebaseapp.com",
      databaseURL: "https://joaguessr-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "joaguessr",
      storageBucket: "joaguessr.firebasestorage.app",
      messagingSenderId: "852224945761",
      appId: "1:852224945761:web:5adc0b5a6e1282b7030420"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. LEAFLET MAP SETUP
    const map = L.map('map').setView([20, 0], 2);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    let currentLayers = [];
    let activeBounds = [];
    let isEventMode = false;

    // Custom Marker Icons
    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const blueIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    function toggleEventMode() {
      isEventMode = !isEventMode;
      const adminElements = document.querySelectorAll('.admin-only');
      const selectContainer = document.getElementById('q-select-container');
      const eventTitle = document.getElementById('event-q-title');
      const nextBtn = document.getElementById('btn-next-q');
      const toggleBtn = document.getElementById('btn-toggle-mode');
      const editor = document.getElementById('target-editor');

      if (isEventMode) {
        adminElements.forEach(el => el.style.display = 'none');
        selectContainer.style.display = 'none';
        editor.style.display = 'none';
        
        eventTitle.style.display = 'inline-block';
        nextBtn.style.display = 'inline-block';
        toggleBtn.innerText = '⚙️ Admin Mode';
        
        updateEventTitle();
      } else {
        adminElements.forEach(el => el.style.display = 'inline-block');
        selectContainer.style.display = 'inline-block';
        
        eventTitle.style.display = 'none';
        nextBtn.style.display = 'none';
        toggleBtn.innerText = '🎉 Event Mode';
      }
    }

    function updateEventTitle() {
      const qNum = document.getElementById('q-select').value;
      document.getElementById('event-q-title').innerText = `Question ${qNum}`;
    }

    function nextQuestion() {
      const select = document.getElementById('q-select');
      let currentQ = parseInt(select.value, 10);
      if (currentQ < 20) {
        select.value = currentQ + 1;
        onQuestionChange();
      } else {
        alert("You have reached the final question!");
      }
    }

    function toggleEditor() {
      const editor = document.getElementById('target-editor');
      editor.style.display = editor.style.display === 'block' ? 'none' : 'block';
      if (editor.style.display === 'block') {
        loadTargetIntoEditor();
      }
    }

    // Broadcast question change to mobile players
    function onQuestionChange() {
      const qNum = parseInt(document.getElementById('q-select').value, 10);
      db.ref('gameState/currentQuestion').set(qNum);
      updateEventTitle();
      loadTargetIntoEditor();
      clearPreviousLayers();
    }

    // Load coordinates from Firebase into the inputs
    async function loadTargetIntoEditor() {
      try {
        const qNum = document.getElementById('q-select').value;
        const snap = await db.ref(`targetAnswers/q${qNum}`).once('value');
        const data = snap.val();
        
        if (data && data.lat !== undefined && data.lng !== undefined) {
          document.getElementById('edit-lat').value = data.lat;
          document.getElementById('edit-lng').value = data.lng;
        } else {
          document.getElementById('edit-lat').value = '';
          document.getElementById('edit-lng').value = '';
        }
      } catch (err) {
        console.error("Error loading target answer:", err);
      }
    }

    // Save target answer directly to Firebase
    async function saveTargetToFirebase() {
      const qNum = document.getElementById('q-select').value;
      const latVal = document.getElementById('edit-lat').value;
      const lngVal = document.getElementById('edit-lng').value;

      const lat = parseFloat(latVal);
      const lng = parseFloat(lngVal);

      if (isNaN(lat) || isNaN(lng)) return alert("Please enter valid Latitude and Longitude numbers!");

      try {
        await db.ref(`targetAnswers/q${qNum}`).set({
          lat: Number(lat.toFixed(7)),
          lng: Number(lng.toFixed(7))
        });
        alert(`Target answer for Question ${qNum} saved!`);
      } catch (err) {
        console.error("Firebase Save Error:", err);
        alert(`Firebase Error: ${err.message || err.code || 'Permission Denied / Network Issue'}`);
      }
    }

    // Delete all user guess entries from Firebase
    async function resetAllGuesses() {
      if (confirm("Are you sure you want to delete all player guesses across all questions?")) {
        try {
          await db.ref('guesses').remove();
          clearPreviousLayers();
          alert("All guess historical data has been completely erased!");
        } catch (err) {
          console.error("Error resetting guesses:", err);
          alert(`Failed to reset guesses: ${err.message || 'Unknown error'}`);
        }
      }
    }

    function clearPreviousLayers() {
      currentLayers.forEach(layer => map.removeLayer(layer));
      currentLayers = [];
      activeBounds = [];
    }

    // 1. Reveal ONLY Player Guesses
    async function revealPlayerGuesses() {
      clearPreviousLayers();

      const qNum = document.getElementById('q-select').value;
      
      try {
        const playersSnap = await db.ref('players').once('value');
        const guessesSnap = await db.ref(`guesses/q${qNum}`).once('value');

        const players = playersSnap.val() || {};
        const guesses = guessesSnap.val() || {};

        Object.keys(guesses).forEach(playerId => {
          const g = guesses[playerId];
          const player = players[playerId] || { name: 'Anonymous' };

          if (g && g.lat !== undefined && g.lng !== undefined) {
            const guessLatLng = [g.lat, g.lng];

            const pMarker = L.marker(guessLatLng, { icon: blueIcon })
              .bindPopup(`
                <div style="font-size:18px;">
                  👑 <b>${player.name}</b><br>
                  <span style="font-size:14px; color:#555;">Submitted Guess</span>
                </div>
              `)
              .addTo(map);

            currentLayers.push(pMarker);
            activeBounds.push(guessLatLng);
          }
        });

        if (activeBounds.length > 1) {
          map.fitBounds(L.latLngBounds(activeBounds), { padding: [80, 80] });
        } else if (activeBounds.length === 1) {
          map.setView(activeBounds[0], 6);
        } else {
          alert(`No guesses submitted yet for Question ${qNum}!`);
        }

      } catch (err) {
        console.error("Error revealing guesses:", err);
        alert("An error occurred while fetching guess data.");
      }
    }

    // 2. Reveal Correct Answer Pin (Red Pin)
// Reveal Correct Answer Pin (Red Pin) & Calculate Distances
async function revealAnswerPin() {
  const qNum = document.getElementById('q-select').value;

  try {
    const targetSnap = await db.ref(`targetAnswers/q${qNum}`).once('value');
    const target = targetSnap.val();

    if (!target || target.lat === undefined || target.lng === undefined) {
      return alert(`No answer coordinates set for Question ${qNum}! Use "⚙️ Set Answers" to set it.`);
    }

    const targetLatLng = L.latLng(target.lat, target.lng);
    const targetMarker = L.marker([target.lat, target.lng], { icon: redIcon })
      .bindPopup(`<b style="color:red;">CORRECT ANSWER LOCATION</b>`)
      .addTo(map);

    currentLayers.push(targetMarker);
    activeBounds.push([target.lat, target.lng]);

    // Fetch players and guesses to compute distances
    const playersSnap = await db.ref('players').once('value');
    const guessesSnap = await db.ref(`guesses/q${qNum}`).once('value');
    const players = playersSnap.val() || {};
    const guesses = guessesSnap.val() || {};

    // Re-render player pins with distance included ONLY in their click popup
    Object.keys(guesses).forEach(playerId => {
      const g = guesses[playerId];
      const player = players[playerId] || { name: 'Anonymous' };

      if (g && g.lat !== undefined && g.lng !== undefined) {
        const guessLatLng = L.latLng(g.lat, g.lng);
        
        // Distance in Kilometers
        const distKm = (targetLatLng.distanceTo(guessLatLng) / 1000).toFixed(2);

        // Save calculated distance to Firebase so index.html can read it directly
        db.ref(`guesses/q${qNum}/${playerId}/distanceKm`).set(parseFloat(distKm));

        // Update popup text on summary screen (only visible when admin/user clicks the pin)
        const pMarker = L.marker([g.lat, g.lng], { icon: blueIcon })
          .bindPopup(`
            <div style="font-size:16px;">
              👑 <b>${player.name}</b><br>
              <span style="font-size:13px; color:#555;">Off by: <b>${distKm} km</b></span>
            </div>
          `)
          .addTo(map);

        currentLayers.push(pMarker);
      }
    });

    if (activeBounds.length > 1) {
      map.fitBounds(L.latLngBounds(activeBounds), { padding: [80, 80] });
    } else {
      map.setView([target.lat, target.lng], 10);
    }

  } catch (err) {
    console.error("Error revealing target answer:", err);
    alert("An error occurred while fetching target answer.");
  }
}
    // Initial sync on page load
    loadTargetIntoEditor();
  </script>
</body>
</html>
