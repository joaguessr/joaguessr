<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JoaGuessr - Admin & Summary Dashboard</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; background: #121212; color: #fff; overflow: hidden; }
    #map { width: 100vw; height: 100vh; z-index: 1; }
    
    /* Top Control Bar */
    #admin-bar {
      position: absolute;
      top: 15px; left: 15px;
      z-index: 1000;
      background: rgba(30, 30, 30, 0.95);
      padding: 10px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #333;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    select, button {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    select { background: #2a2a2a; color: white; border: 1px solid #444; }
    .btn-reveal { background: #00d26a; color: white; }
    .btn-settings { background: #333; color: white; border: 1px solid #555; }

    /* Modal for Editing Answers */
    #answerModal {
      position: absolute;
      top: 75px; left: 15px;
      z-index: 1000;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      border: 1px solid #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: none;
    }
    #answerModal h3 { color: #00d26a; margin-bottom: 10px; font-size: 16px; }
    #answerModal label { font-size: 12px; color: #aaa; display: block; margin-top: 8px; }
    #answerModal input {
      width: 100%; padding: 8px; margin-top: 4px;
      background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px;
    }
    #answerModal button { width: 100%; margin-top: 15px; background: #00d26a; color: white; }
  </style>
</head>
<body>

<div id="admin-bar">
  <label style="font-size:14px; font-weight:bold;">Question:</label>
  <select id="questionSelect">
    <option value="q1">Q1</option>
    <option value="q2">Q2</option>
    <option value="q3">Q3</option>
    <option value="q4">Q4</option>
    <option value="q5">Q5</option>
  </select>
  <button class="btn-reveal" onclick="revealMapPins()">Reveal Map Pins</button>
  <button class="btn-settings" onclick="toggleAnswerModal()">⚙️ Set Answers</button>
</div>

<!-- Answer Config Modal -->
<div id="answerModal">
  <h3>Edit Answer Location</h3>
  <p style="font-size:11px; color:#888;">Coordinates auto-clear if no answer is saved for the selected question.</p>
  
  <label>Latitude:</label>
  <input type="text" id="latInput" placeholder="e.g. 1.2926">
  
  <label>Longitude:</label>
  <input type="text" id="lngInput" placeholder="e.g. 103.8552">
  
  <button onclick="saveAnswerLocation()">Save Location for Selected Q</button>
</div>

<div id="map"></div>

<!-- Leaflet & Firebase SDKs -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyAK-Ho6KXOyBIJuNASCjXYtbb7ZbM_eD-A",
    authDomain: "joaguessr.firebaseapp.com",
    databaseURL: "https://joaguessr-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "joaguessr",
    storageBucket: "joaguessr.firebasestorage.app",
    messagingSenderId: "852224945761",
    appId: "1:852224945761:web:5adc0b5a6e1282b7030420"
  };
  
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 2. MAP SETUP
  const map = L.map('map').setView([1.3521, 103.8198], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let revealLayerGroup = L.layerGroup().addTo(map);

  // 3. DROPDOWN CHANGE LISTENER (Fixes persistent Lat/Lng issue)
  const questionSelect = document.getElementById('questionSelect');
  questionSelect.addEventListener('change', loadAnswerForSelectedQ);

  function loadAnswerForSelectedQ() {
    const selectedQ = questionSelect.value; // "q1", "q2", etc.
    
    // Update global game state so player screens reflect the question change
    db.ref('gameState/currentQuestion').set(parseInt(selectedQ.replace('q', '')));

    // Clear previous map markers
    revealLayerGroup.clearLayers();

    // Check Firebase for existing coordinates
    db.ref(`answers/${selectedQ}`).once('value', (snap) => {
      const data = snap.val();
      if (data && data.lat && data.lng) {
        document.getElementById('latInput').value = data.lat;
        document.getElementById('lngInput').value = data.lng;
      } else {
        // Clear input fields if no answer location exists for this question
        document.getElementById('latInput').value = '';
        document.getElementById('lngInput').value = '';
      }
    });
  }

  function toggleAnswerModal() {
    const modal = document.getElementById('answerModal');
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    if (modal.style.display === 'block') {
      loadAnswerForSelectedQ();
    }
  }

  // 4. SAVE ANSWER COORDINATES TO FIREBASE
  function saveAnswerLocation() {
    const selectedQ = questionSelect.value;
    const lat = parseFloat(document.getElementById('latInput').value.trim());
    const lng = parseFloat(document.getElementById('lngInput').value.trim());

    if (isNaN(lat) || isNaN(lng)) {
      return alert("Please enter valid numeric latitude and longitude values.");
    }

    db.ref(`answers/${selectedQ}`).set({ lat: lat, lng: lng }).then(() => {
      alert(`Answer for ${selectedQ.toUpperCase()} saved successfully!`);
      document.getElementById('answerModal').style.display = 'none';
    });
  }

  // 5. REVEAL MAP PINS & DRAW DOTTED LINES
  async function revealMapPins() {
    const selectedQ = questionSelect.value;
    revealLayerGroup.clearLayers(); // Clear old markers/lines

    try {
      // Fetch Answer Location
      const answerSnap = await db.ref(`answers/${selectedQ}`).once('value');
      const answerData = answerSnap.val();

      // Fetch Player Guesses
      const guessesSnap = await db.ref(`guesses/${selectedQ}`).once('value');
      const guessesData = guessesSnap.val();

      // Fetch Player Names
      const playersSnap = await db.ref(`players`).once('value');
      const playersData = playersSnap.val() || {};

      if (!guessesData) {
        alert(`No guesses found for ${selectedQ.toUpperCase()} yet.`);
        return;
      }

      const bounds = [];

      // A. Render Target Answer Pin (Green Icon/Marker)
      if (answerData && answerData.lat && answerData.lng) {
        const targetLatLng = [answerData.lat, answerData.lng];
        L.marker(targetLatLng)
          .bindPopup(`<b>Target Location (${selectedQ.toUpperCase()})</b>`)
          .addTo(revealLayerGroup);
        bounds.push(targetLatLng);
      }

      // B. Render Player Pins and Dotted Lines
      Object.keys(guessesData).forEach((playerId) => {
        const guess = guessesData[playerId];
        const player = playersData[playerId] || {};
        const playerName = player.name || "Player";

        if (guess.lat && guess.lng) {
          const guessLatLng = [guess.lat, guess.lng];
          
          // Player Marker
          L.marker(guessLatLng)
            .bindPopup(`<b>${playerName}</b>'s Guess`)
            .addTo(revealLayerGroup);
          bounds.push(guessLatLng);

          // Dotted Line to Answer Location (if answer exists)
          if (answerData && answerData.lat && answerData.lng) {
            L.polyline([guessLatLng, [answerData.lat, answerData.lng]], {
              color: '#ff4757',
              dashArray: '8, 8',
              weight: 3,
              opacity: 0.8
            }).addTo(revealLayerGroup);
          }
        }
      });

      // Automatically adjust map zoom to display all pins
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }

    } catch (err) {
      console.error("Error revealing pins:", err);
      alert("Error fetching data from Firebase. Check browser console.");
    }
  }

  // Initial load
  loadAnswerForSelectedQ();
</script>

</body>
</html>
