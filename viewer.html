<!DOCTYPE html>
<html>
<head>
  <title>Specto Live Viewer & Analytics</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { 
      background: #0f111a; 
      color: white; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px;
    }
    h2 { margin-bottom: 20px; color: #00e5ff; text-transform: uppercase; letter-spacing: 1px; }
    
    .dashboard { 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
      gap: 25px; 
      flex-wrap: wrap;
    }
    
    canvas { 
      background: #181a26; 
      border: 2px solid #2a2d3d; 
      border-radius: 10px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    
    .metrics-panel { 
      background: #181a26; 
      padding: 20px; 
      border-radius: 10px; 
      text-align: left; 
      width: 260px; 
      border: 1px solid #2a2d3d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .metric-card { 
      margin-bottom: 20px; 
      border-bottom: 1px solid #2a2d3d; 
      padding-bottom: 12px; 
    }
    .metric-card:last-child { border-bottom: none; margin-bottom: 0; }
    
    .metric-title { 
      font-size: 11px; 
      color: #8892b0; 
      text-transform: uppercase; 
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    
    .metric-value { 
      font-size: 30px; 
      font-weight: 800; 
      color: #00e5ff; 
      margin-top: 4px; 
      text-shadow: 0 0 10px rgba(0,229,255,0.3);
    }

    .legend {
      margin-top: 15px;
      font-size: 12px;
      color: #8892b0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .color-box { width: 12px; height: 12px; border-radius: 3px; }
  </style>
</head>
<body>
  <h2>Specto Live Trajectory & Analytics</h2>
  
  <div class="dashboard">
    <!-- 2D Canvas Lane Representation -->
    <canvas id="laneCanvas" width="300" height="700"></canvas>

    <!-- Real-time Analytics Dashboard -->
    <div class="metrics-panel">
      <div class="metric-card">
        <div class="metric-title">Ball Speed</div>
        <div class="metric-value" id="speedVal">-- mph</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Entry Angle</div>
        <div class="metric-value" id="angleVal">-- °</div>
      </div>
      
      <div class="metric-card">
        <div class="metric-title">Foul Line Board</div>
        <div class="metric-value" id="foulBoard">--</div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="color-box" style="background: #00e5ff; box-shadow: 0 0 6px #00e5ff;"></div>
          <span>Active Shot Path</span>
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: rgba(255,255,255,0.2);"></div>
          <span>Shot History (Last 10)</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration Setup
    const firebaseConfig = {
      apiKey: "AIzaSyD-N9N3wyM9FGIonLWDdKlAjQi9GNSFbqU",
      authDomain: "bowling-target.firebaseapp.com",
      databaseURL: "https://bowling-target-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "bowling-target"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('laneCanvas');
    const ctx = canvas.getContext('2d');

    // Scale 39 boards wide to canvas width, 60 feet deep to canvas height
    const scaleX = canvas.width / 39;
    const scaleY = canvas.height / 60;

    let shotHistory = {};
    let activeShotId = null;

    // 2. Feature #3: Listen for Previous Shots (Shot History)
    db.ref("shots").limitToLast(10).on("value", snapshot => {
      shotHistory = snapshot.val() || {};
      redrawCanvas();
    });

    // 3. Listen for Live Active Shot Data
    db.ref("activeShot").on("value", snapshot => {
      activeShotId = snapshot.val();
      if (!activeShotId) return;

      db.ref(`shots/${activeShotId}/points`).on("value", pointsSnap => {
        const rawPoints = pointsSnap.val();
        if (!rawPoints) return;

        // Convert key-value object to array and sort sequentially by timestamp
        const pts = Object.values(rawPoints).sort((a, b) => a.t - b.t);
        
        redrawCanvas(pts);
        calculateAnalytics(pts);
      });
    });

    // 4. Drawing Engine (Faint Ghost Lines + Live Neon Line)
    function redrawCanvas(activePts = []) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw standard lane pin deck markers/foul line guides
      drawLaneGuides();

      // Render Historical Trajectories (Faint Translucent Overlay)
      Object.keys(shotHistory).forEach(shotId => {
        if (shotId === activeShotId || !shotHistory[shotId].points) return;
        const pts = Object.values(shotHistory[shotId].points).sort((a, b) => a.t - b.t);
        
        ctx.beginPath();
        pts.forEach((p, i) => {
          const px = p.x * scaleX;
          const py = canvas.height - (p.y * scaleY); // Flip Y (0ft foul line at bottom)
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Render Active Shot Trajectory (Neon Cyan Specto Glow)
      if (activePts.length > 0) {
        ctx.beginPath();
        activePts.forEach((p, i) => {
          const px = p.x * scaleX;
          const py = canvas.height - (p.y * scaleY);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 4;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0; // Clear blur after drawing
      }
    }

    // Helper to render foul line visually at canvas bottom
    function drawLaneGuides() {
      ctx.strokeStyle = "#ff0055";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 2);
      ctx.lineTo(canvas.width, canvas.height - 2);
      ctx.stroke();
    }

    // 5. Feature #1: Real-time Analytics Calculation
    function calculateAnalytics(pts) {
      if (pts.length < 3) return;

      // Board index at Foul Line (y ≈ 0 ft)
      const entryPoint = pts[0];
      document.getElementById('foulBoard').innerText = entryPoint.x.toFixed(1);

      // Average Speed Calculation: (Total Distance Traveled / Elapsed Time) -> converted to MPH
      const pFirst = pts[0];
      const pLast = pts[pts.length - 1];
      
      // Board width offset conversion to feet (approx 1.06 inches per board)
      const dxFeet = ((pLast.x - pFirst.x) * 1.06) / 12;
      const dyFeet = pLast.y - pFirst.y;
      const distanceFeet = Math.hypot(dxFeet, dyFeet);
      
      const durationSeconds = (pLast.t - pFirst.t) / 1000;

      if (durationSeconds > 0 && distanceFeet > 0) {
        const feetPerSecond = distanceFeet / durationSeconds;
        const mph = feetPerSecond * (3600 / 5280);
        document.getElementById('speedVal').innerText = mph.toFixed(1) + " mph";
      }

      // Entry Angle Calculation: Angle vector across the final 15 feet of travel (y >= 45ft)
      const backEndPoints = pts.filter(p => p.y >= 45);
      if (backEndPoints.length >= 2) {
        const pStart = backEndPoints[0];
        const pEnd = backEndPoints[backEndPoints.length - 1];
        
        const deltaXInches = (pEnd.x - pStart.x) * 1.06;
        const deltaYInches = (pEnd.y - pStart.y) * 12;
        
        // Compute entry angle relative to vertical lane lines
        const angleRadians = Math.atan2(deltaXInches, deltaYInches);
        const angleDegrees = Math.abs(angleRadians * (180 / Math.PI));
        
        document.getElementById('angleVal').innerText = angleDegrees.toFixed(1) + " °";
      }
    }
  </script>
</body>
</html>
